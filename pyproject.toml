[project]
name = "house-style-dev"
version = "0.0.0"  # dev environment only: the plugin is unversioned (commit SHA), see rules/releasing.md
description = "Dev environment for the house-style plugin."
requires-python = ">=3.11"

[dependency-groups]
dev = ["pytest", "pytest-cov", "ruff"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["lib", "hooks", "scripts"]
addopts = "--cov=lib --cov=hooks --cov=scripts --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.report]
fail_under = 100
exclude_also = ["if __name__ == .__main__.:"]
