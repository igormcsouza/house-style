name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - name: Manifests are valid JSON and the version is unpinned
        run: |
          uv run python - <<'PY'
          import json
          p = json.load(open(".claude-plugin/plugin.json"))
          m = json.load(open(".claude-plugin/marketplace.json"))
          json.load(open("hooks/hooks.json"))
          assert p["name"] == m["plugins"][0]["name"], "plugin/marketplace name mismatch"
          assert "version" not in p and "version" not in m["plugins"][0], "do not pin a plugin version (commit SHA is the version)"
          print("manifests ok:", p["name"], "(unpinned: every commit is a version)")
          PY
      - name: Contrast check (every accent)
        run: uv run python scripts/build.py --check
      - name: Lint and format (house ruff config)
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Tests (pytest, 100% coverage enforced)
        run: uv run pytest
      - name: Self-audit (dogfood the standard)
        run: uv run python scripts/audit.py . --ignore templates

  templates:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        template: [fastmcp, fastapi, cdk]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: ${{ matrix.template }} template (tests, 100% coverage, house ruff config)
        working-directory: templates/${{ matrix.template }}
        run: |
          uv sync
          uv run pytest -q
          uv run ruff check --config ../python/ruff.toml .
