site_name: "{{name}}"
theme:
  name: material
  logo: assets/icon.svg
  favicon: assets/icon.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: "{{accent}}"   # Material name: green | blue | red | deep purple | amber | teal
      accent: "{{accent}}"
      toggle: { icon: material/brightness-7, name: Switch to dark mode }
    - scheme: slate
      primary: "{{accent}}"
      accent: "{{accent}}"
      toggle: { icon: material/brightness-4, name: Switch to light mode }
markdown_extensions:
  - admonition
  - pymdownx.highlight: { anchor_linenums: true }
  - pymdownx.superfences
  - toc: { permalink: true }
plugins:
  - search
